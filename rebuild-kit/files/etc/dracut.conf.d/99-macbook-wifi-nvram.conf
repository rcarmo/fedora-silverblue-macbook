# Corrected-integration experimental c97 trial; not installed.
# Main module is loaded early, with its dynamically requested WCC helper
# explicitly included. WCC depends on brcmfmac and is requested during attach;
# do not attempt to preload the helper before the main module.
force_drivers+=" brcmfmac "
add_drivers+=" brcmfmac-wcc "
include_src+=("/etc/firmware/macbook-wifi/brcm/brcmfmac43602-pcie.txt")
include_target+=("/usr/lib/firmware/brcm/brcmfmac43602-pcie.txt")
